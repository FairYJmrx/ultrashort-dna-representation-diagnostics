# E5 fixed-capacity 35-species representation probe
# Large FASTQ/token inputs remain external and are referenced by the generated manifest.

experiment_id: E5_fixed_capacity_multiclass_probe
dataset_id: regenerated_35sp_75bp_balanced_batch
simulator_family: per-species 75-bp source FASTQ resampling
read_length_bp: 75
n_species: 35

simulation:
  input_builder: data_pipeline/preprocess/build_balanced_35_species_fastq.py
  panel_metadata: data/e5_35species/species_panel.csv
  seed: 42
  simulator: source_per_species_fastq_batch
  profile_read_length_bp: 75
  genome_count_total: 35
  genome_count_real: 35
  gold_standard_assembly: not_applicable
  pooled_gold_standard_assembly: not_applicable
  anonymization: not_applicable

preprocessing:
  tool: build_balanced_35_species_fastq.py
  observed_version: release_candidate_20260814
  observed_input_cycles: 75
  observed_post_filter_mean_length_bp: 75
  observed_passed_reads: 1500000
  subset:
    max_reads_per_species: 50000
    total_read_cap: 1500000
    seed: 42
    selection_script: data_pipeline/preprocess/build_balanced_35_species_fastq.py
    indices_file: results/e5_35species/subset_indices.npy
    labels_file: results/e5_35species/subset_labels.npy

external_inputs:
  fastq_role: per-species 75-bp source reads used to build a fresh balanced batch
  label_role: one integer species label per read, aligned by row
  token_cache_role: optional precomputed token representation, aligned by row
  source_manifest_required: true
  source_manifest_columns: [label, species, fastq]

split:
  seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  group_ids_required: false
  independent_reads_override: true
  independence_scope: source per-species FASTQ records; not an unseen-genome split

readout:
  model: sklearn.neural_network.MLPClassifier
  hidden_layer_sizes: [128, 64]
  activation: relu
  solver: adam
  learning_rate_init: 0.001
  batch_size: 256
  max_iter: 50
  random_state: 42
  same_budget_across_representations: true

representations:
  - CK4
  - CK5
  - CK7
  - CK4_P
  - CK4_MSP
  - CK4P_MSP
  - PseKNC
  - PseEIIP

scope:
  claim: closed-set representation accessibility under a fixed low-capacity readout
  excluded_claims:
    - production taxonomy classification
    - clinical diagnostic validity
    - database matching replacement
    - unseen-genome generalization unless group metadata supports it

artifacts:
  manifest_dir: results/e5_35species_regenerated_75bp/manifest
  split_file: results/e5_35species_regenerated_75bp/splits.npz
  subset_indices: not_applicable_balanced_batch
  subset_labels: results/e5_35species_regenerated_75bp/labels.npy
  readout_dir: results/e5_35species_regenerated_75bp/readout
  required_files:
    - e5_manifest.json
    - e5_metrics.csv
