# E5 fixed-capacity 35-species representation probe
# Large FASTQ/token inputs remain external and are referenced by the generated manifest.

experiment_id: E5_fixed_capacity_multiclass_probe
dataset_id: camisim_35sp_75bp
simulator_family: CAMISIM-derived synthetic community
read_length_bp: 75
n_species: 35

simulation:
  input_builder: data_pipeline/simulate/prepare_camisim_35species_inputs.py
  panel_metadata: data/e5_35species/species_panel.csv
  panel_sheet_if_xlsx: Blood_ALL_Master
  seed: 42
  community_size_gbp: 0.5
  number_of_samples: 1
  simulator: ART
  profile_read_length_bp: 75
  fragment_size_mean_bp: 200
  fragment_size_sd_bp: 10
  genome_count_total: 35
  genome_count_real: 35
  abundance_mode: differential
  log_mu: 1
  log_sigma: 2
  gold_standard_assembly: true
  pooled_gold_standard_assembly: true
  anonymization: false

preprocessing:
  tool: fastp
  observed_version: 1.3.5
  observed_input_cycles: 75
  observed_post_filter_mean_length_bp: 74
  observed_passed_reads: 13329387

external_inputs:
  fastq_role: quality-controlled single-end reads
  label_role: one integer species label per read, aligned by row
  token_cache_role: optional precomputed token representation, aligned by row
  source_manifest_required: true

split:
  seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  group_ids_required: true
  independent_reads_override: false

readout:
  model: sklearn.neural_network.MLPClassifier
  hidden_layer_sizes: [128, 64]
  activation: relu
  solver: adam
  learning_rate_init: 0.001
  batch_size: 256
  max_iter: 50
  random_state: 42
  same_budget_across_representations: true

representations:
  - CK4
  - CK5
  - CK7
  - CK4_P
  - CK4_MSP
  - CK4P_MSP
  - PseKNC
  - PseEIIP

scope:
  claim: closed-set representation accessibility under a fixed low-capacity readout
  excluded_claims:
    - production taxonomy classification
    - clinical diagnostic validity
    - database matching replacement
    - unseen-genome generalization unless group metadata supports it

artifacts:
  manifest_dir: results/e5_35species/manifest
  split_file: results/e5_35species/splits.npz
  readout_dir: results/e5_35species/readout
  required_files:
    - e5_manifest.json
    - e5_metrics.csv
